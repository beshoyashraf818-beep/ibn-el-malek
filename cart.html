<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | ابن الملك</title><link rel="stylesheet" href="style.css"><style>.cart-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:10px 0}.cart-row small{display:block;margin:6px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;border-radius:8px;padding:8px 12px;cursor:pointer}.qty .danger{background:#b42318;color:#fff}.total{font-size:20px}.summary{margin-top:16px}</style></head><body><header><nav><a class="logo" href="index.html">♛ <b>ابن الملك</b></a><a href="index.html">← المتجر</a><span>🛒 السلة: <b id="cartCount">0</b></span></nav></header><main><h1>سلة المشتريات</h1><div id="cart"></div><div id="summary" class="panel summary"></div><form id="orderForm" class="panel"><h2>بيانات الطلب</h2><input name="name" required placeholder="الاسم"><input name="phone" required inputmode="tel" placeholder="رقم الموبايل"><select name="gov" required><option value="">اختر المحافظة</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الإسماعيلية</option><option>الشرقية</option><option>الدقهلية</option><option>القليوبية</option><option>المنوفية</option><option>البحيرة</option><option>الغربية</option><option>بورسعيد</option><option>السويس</option><option>دمياط</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>مطروح</option><option>البحر الأحمر</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>كفر الشيخ</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الوادي الجديد</option></select><textarea name="address" required placeholder="العنوان بالتفصيل"></textarea><button class="btn">تأكيد الطلب عبر واتساب</button></form><div id="toast" class="toast"></div></main><script src="app.js"></script><script>renderCart();document.querySelector('#orderForm').addEventListener('submit',submitOrder);</script></body></html>
